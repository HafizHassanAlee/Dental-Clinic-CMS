services:
  - type: web
    name: rumi-dental-care
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: muhammadhafizhassan228@gmail.com
      - key: SMTP_FROM_EMAIL
        value: muhammadhafizhassan228@gmail.com
      - key: CLINIC_WHATSAPP_NUMBER
        value: "+923102468080"
      - key: DATABASE_URL
        sync: false
