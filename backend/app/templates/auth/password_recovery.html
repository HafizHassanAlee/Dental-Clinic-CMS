{% extends "layouts/public_base.html" %}
{% block content %}
<section class="py-16 bg-[#f6f9f9] min-h-[70vh] flex items-center">
  <div class="max-w-md w-full mx-auto px-4">
    <div class="bg-white rounded-3xl shadow-lg border border-slate-200 p-8 space-y-6">
      <div class="text-center">
        <span class="px-3 py-1 rounded-full bg-sky-50 text-[#01578c] text-xs font-bold uppercase">Account Recovery</span>
        <h1 class="text-2xl font-extrabold text-slate-900 mt-2">Reset Your Password</h1>
        <p class="text-xs text-slate-500 mt-1">
          Request a single-use password reset token or enter your token below to set a new password.
        </p>
      </div>

      <div id="recovery-feedback" class="hidden p-3 rounded-xl text-xs font-medium" role="status"></div>

      <!-- Step 1: Request Reset Token -->
      <form onsubmit="requestResetToken(event)" class="space-y-3">
        <label for="forgot-email" class="block text-xs font-bold text-slate-700">1. Request Reset Token by Email</label>
        <div class="flex gap-2">
          <input id="forgot-email" type="email" required placeholder="your.email@example.com"
            class="flex-1 px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />
          <button type="submit" class="px-4 py-2.5 rounded-xl bg-[#01578c] text-white text-xs font-bold hover:bg-[#013f66]">
            Send Token
          </button>
        </div>
      </form>

      <!-- Step 2: Complete Reset with Token -->
      <form onsubmit="completePasswordReset(event)" class="space-y-3 pt-4 border-t border-slate-100">
        <p class="text-xs font-bold text-slate-700">2. Complete Password Reset</p>
        <div>
          <label for="reset-token" class="block text-xs text-slate-600 mb-1">Single-Use Reset Token</label>
          <input id="reset-token" type="text" required placeholder="Paste reset token"
            class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm" />
        </div>
        <div>
          <label for="reset-new-pwd" class="block text-xs text-slate-600 mb-1">New Password</label>
          <input id="reset-new-pwd" type="password" required minlength="8"
            class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm" />
        </div>
        <div>
          <label for="reset-confirm-pwd" class="block text-xs text-slate-600 mb-1">Confirm New Password</label>
          <input id="reset-confirm-pwd" type="password" required minlength="8"
            class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm" />
        </div>
        <button type="submit" class="w-full py-2.5 rounded-xl bg-slate-900 text-white text-xs font-bold hover:bg-slate-800">
          Update Password
        </button>
      </form>

      <div class="text-center text-xs pt-2">
        <a href="/login" class="font-bold text-[#01578c] hover:underline">← Back to Patient Login</a>
      </div>
    </div>
  </div>
</section>

<script>
async function requestResetToken(e) {
  e.preventDefault();
  const box = document.getElementById('recovery-feedback');
  const email = document.getElementById('forgot-email').value.trim();
  try {
    const res = await rumiApi('/api/v1/auth/forgot-password', {
      method: 'POST',
      body: JSON.stringify({ email })
    });
    box.className = 'p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-medium';
    box.textContent = res.message + (res.dev_reset_token ? ` (Dev Token: ${res.dev_reset_token})` : '');
    if (res.dev_reset_token) {
      document.getElementById('reset-token').value = res.dev_reset_token;
    }
    box.classList.remove('hidden');
  } catch (err) {
    box.className = 'p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs font-medium';
    box.textContent = err.message;
    box.classList.remove('hidden');
  }
}

async function completePasswordReset(e) {
  e.preventDefault();
  const box = document.getElementById('recovery-feedback');
  try {
    const res = await rumiApi('/api/v1/auth/reset-password', {
      method: 'POST',
      body: JSON.stringify({
        token: document.getElementById('reset-token').value.trim(),
        new_password: document.getElementById('reset-new-pwd').value,
        confirm_password: document.getElementById('reset-confirm-pwd').value
      })
    });
    box.className = 'p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-medium';
    box.textContent = res.message;
    box.classList.remove('hidden');
    setTimeout(() => { window.location.href = '/login'; }, 1200);
  } catch (err) {
    box.className = 'p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs font-medium';
    box.textContent = err.message;
    box.classList.remove('hidden');
  }
}
</script>
{% endblock %}
